name: RDBMS Program 13 - 3NF Autograding

on:
  push:
  pull_request:

jobs:
  autograding:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: StudentDB

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest mysql-connector-python

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -proot && break
            sleep 2
          done

      - name: Execute student SQL
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            StudentDB < starter.sql

      - name: Run tests
        run: |
          pytest -v tests/test_solution.py
